name: Publish Inspiration articles

# Generates static pages for new Soro-published articles and commits them so
# GitHub Pages serves them (oakdev.app/<slug>). Runs on a schedule and can be
# triggered manually from the Actions tab.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate article pages from the Soro feed
        run: node scripts/generate-articles.js

      - name: Commit and push if changed
        run: |
          git config user.name "oakdev-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: sync Inspiration articles from Soro feed"
            git push
            echo "Published article changes."
          else
            echo "No changes — articles already up to date."
          fi
